name: 收盘选股

on:
  schedule:
    # 北京时间 15:10（UTC 07:10），周一至周五
    - cron: '10 7 * * 1-5'
  workflow_dispatch:

concurrency:
  # 同一时间只允许一个选股任务运行，避免并发写数据库冲突
  group: stock-selection
  cancel-in-progress: false

jobs:
  run-selection:
    runs-on: ubuntu-latest
    # init 约 10 分钟 + 选股约 6 分钟，留足余量
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        # 注意：不要换成阿里云镜像。GitHub runner 在海外，阿里云 PyPI 会慢到
        # 远超 20 分钟（2026-10-13 实测 pip install 被 timeout 杀掉导致整个
        # 选股任务失败）。保持默认 PyPI + setup-python 的 pip 缓存即可。
        run: pip install -r requirements.txt
        timeout-minutes: 30

      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: |
            data
            !data/running
          # 原key 使用 github.run_id（每次运行都唯一），导致缓存永不命中、
          # 也无法保存，每个交易日都要重新 init（约 10 分钟）。
          # 改为按仓库+运行号保存，并用 restore-keys 回退到最近一次可用缓存。
          key: stock-db-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            stock-db-${{ github.repository }}-
            stock-db-

      - name: Check database
        id: check-db
        run: |
          if [ ! -f "data/stock_selection.db" ]; then
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "数据库不存在，将执行初始化"
          else
            SIZE=$(stat -c%s "data/stock_selection.db" 2>/dev/null || echo 0)
            echo "数据库大小: $SIZE 字节"
            # 小于 1MB 视为损坏/未完成，重新初始化
            if [ "$SIZE" -lt 1000000 ]; then
              echo "exists=false" >> $GITHUB_OUTPUT
              echo "数据库过小，判定为无效，将重新初始化"
            else
              echo "exists=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Initialize data (first run only)
        if: steps.check-db.outputs.exists == 'false'
        run: |
          echo "首次运行：初始化数据库，约需 10-15 分钟..."
          python main.py init
        timeout-minutes: 60

      - name: Run selection and push
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python main.py run
        timeout-minutes: 40

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore